services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: inventorypass
      MYSQL_ROOT_PASSWORD: localrootpass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
  app:
    build: .
    ports: ["8085:8085"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/inventory
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: inventorypass
    depends_on:
      db:
        condition: service_healthy
