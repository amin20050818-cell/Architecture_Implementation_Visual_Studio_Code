apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-secret
type: Opaque
stringData:
  username: inventory
  password: CHANGE_ME_BEFORE_DEPLOYMENT
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels: {app: inventory-service}
  template:
    metadata:
      labels: {app: inventory-service}
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:1.0
          ports: [{containerPort: 8085}]
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/inventory
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: {name: inventory-db-secret, key: username}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: inventory-db-secret, key: password}
