apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-service
spec:
  replicas: 3
  selector:
    matchLabels: {app: attendance-service}
  template:
    metadata:
      labels: {app: attendance-service}
    spec:
      containers:
        - name: attendance-service
          image: attendance-service:1.0
          ports: [{containerPort: 8081}]
---
apiVersion: v1
kind: Service
metadata:
  name: attendance-service
spec:
  selector: {app: attendance-service}
  ports: [{port: 8081, targetPort: 8081}]
